name = "gemstocks-shop"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "gemstocks"
database_id = "00000000-0000-0000-0000-000000000000" # replace with the id from: wrangler d1 create gemstocks

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "gemstocks-images"
